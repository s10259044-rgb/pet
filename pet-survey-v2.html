.ck-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}

.email-tbl td{padding:7px 10px;border-bottom:1px solid var(--line)}
.empty{text-align:center;padding:34px 10px;color:var(--ink2)}

function buildFQ(syms){
  const seen=new Set(),q=[];
  FQS.forEach(fq=>{ if(!seen.has(fq.id)&&fq.trig.some(t=>syms.includes(t))){ q.push(fq);seen.add(fq.id); } });
  return q;
}

function computeScores(){
  const s={joint:0,coat:0,cardio:0,gi:0,immune:0};
  const age=S.basic.age, sz=S.basic.size;
  if(age==='senior10'){s.joint+=20;s.cardio+=15;s.immune+=10;}
  else if(age==='mature7'){s.joint+=10;s.cardio+=8;}
  else if(age==='puppy'){s.immune+=5;}
  if(sz==='large')s.joint+=18;
  else if(sz==='medium')s.joint+=8;



  const fm={
    q1:{'需要明顯暖身才能走':{joint:20},'慢慢才走順':{joint:10}},
    q2:{'滿常出現':{joint:20},'偶爾看到':{joint:10}},
    q6:{'明顯不想動了':{cardio:20},'有點降低，需要哄才動':{cardio:10}},
    q7:{'喘很久或有異聲':{cardio:20},'要休息一陣子才順':{cardio:10}},
    q8:{'3天以上':{gi:20},'1到2天':{gi:10}},
    q9:{'常嘔吐、打嗝或明顯不舒服':{gi:18},'偶爾吃完就趴著不動':{gi:8}},
    q10:{'明顯變少或有時暴食':{gi:15},'偶爾挑食':{gi:8}},
    q11:{'兩次以上':{immune:20},'有一次':{immune:10}},
    q12:{'超過一週或反覆發炎':{immune:18},'大約一週':{immune:8}},
    q13:{'確定有過敏原':{immune:15,coat:8},'偶爾懷疑有':{immune:8}},
    // 品種感知掉毛計分：先記錄被毛類型，後面用組合判斷
    q_ctype:{},  // 純紀錄，不直接計分
    q_shed:{'局部稀疏或有禿毛現象':{coat:30},'均勻少量，不特別異常':{coat:0},'換季時大量，其他時間還好':{coat:0}},
    q4:{'常有皮屑、紅疹或結痂':{coat:18},'偶爾有乾燥或小突起':{coat:8}},
    q5:{'常有異味或常搖頭抓耳':{coat:12,immune:12},'偶爾需要清耳':{coat:6,immune:6}},
  };
  Object.entries(S.fans).forEach(([k,v])=>{
    if(fm[k]&&fm[k][v]) Object.entries(fm[k][v]).forEach(([c,n])=>s[c]+=n);
  });
  // 品種感知修正：換季大量掉毛 × 雙層毛品種 → 正常現象，不計入皮膚問題
  const ctype = S.fans['q_ctype']||'';
  const shed  = S.fans['q_shed']||'';
  const isDoubleCoat = ctype.includes('雙層毛');
  const isSeasonalShed = shed === '換季時大量，其他時間還好';
  if(isDoubleCoat && isSeasonalShed) {
    // 雙層毛換季掉毛是正常的，扣除可能被誤判的皮膚分數
    s.coat = Math.max(0, s.coat - 15);
  } else if(!isDoubleCoat && isSeasonalShed) {
    // 非雙層毛卻大量換季掉毛，適度提高關注
    s.coat = Math.min(100, s.coat + 10);
  }
  // 儲存品種感知結果供結果頁顯示
  S.coatNote = isDoubleCoat && isSeasonalShed
    ? '換季大量掉毛對雙層毛品種來說是正常現象，不需過度擔心 🐾'
    : shed === '局部稀疏或有禿毛現象'
    ? '局部禿毛或稀疏需要留意，建議觀察是否合併皮膚紅疹或搔癢'
    : '';

  Object.keys(s).forEach(k=>s[k]=Math.min(100,s[k]));
  return s;
}

function getReasonText(cat){
  const fa=S.fans, b=S.basic;
  const age=b.age, sz=b.size;
  const p=[];
  if(cat==='joint'){
    if(fa.q1==='需要明顯暖身才能走'||fa.q1==='慢慢才走順') p.push('起身後需要一段時間才能正常走路');
    if(fa.q2==='滿常出現') p.push('走路時偶有跛腳或偏向一側的情形');
    if(age==='senior10') p.push('年齡進入高齡階段，關節保養格外重要');
    else if(age==='mature7') p.push('進入熟齡期，關節耗損風險逐漸上升');
    if(sz==='large') p.push('大型體型對關節的長期負擔較大');
  } else if(cat==='coat'){
    if(fa.q_shed==='局部稀疏或有禿毛現象') p.push('觀察到局部禿毛或稀疏的現象');
    if(fa.q4==='常有皮屑、紅疹或結痂') p.push('皮膚有明顯異狀，需要加強保養');
    else if(fa.q4==='偶爾有乾燥或小突起') p.push('皮膚偶爾出現乾燥或小突起');
    if(fa.q5==='常有異味或常搖頭抓耳') p.push('耳朵反覆有異味或搔癢');
  } else if(cat==='cardio'){
    if(fa.q6==='明顯不想動了') p.push('活動意願與以前相比明顯降低');
    if(fa.q7==='喘很久或有異聲') p.push('活動後喘氣持續較久或有異聲');
    else if(fa.q7==='要休息一陣子才順') p.push('活動後需要較長時間才能恢復正常呼吸');
    if(age==='senior10') p.push('高齡毛孩的心血管保健需要特別重視');
  } else if(cat==='gi'){
    if(fa.q8==='3天以上') p.push('近一週便便不成形的天數較多');
    else if(fa.q8==='1到2天') p.push('偶爾有便便偏軟的情形');
    if(fa.q9==='常嘔吐、打嗝或明顯不舒服') p.push('進食後常有嘔吐或不舒服的反應');
    if(fa.q10==='明顯變少或有時暴食') p.push('食慾出現明顯起伏');
    else if(fa.q10==='偶爾挑食') p.push('偶爾出現挑食的情形');
  } else if(cat==='immune'){
    if(fa.q11==='兩次以上') p.push('近一個月內反覆出現感染或生病狀況');
    else if(fa.q11==='有一次') p.push('近期有一次感染或生病的記錄');
    if(fa.q12==='超過一週或反覆發炎') p.push('小傷口癒合速度慢，容易反覆發炎');
    if(fa.q13==='確定有過敏原') p.push('有已知過敏原，免疫調節需要特別補充');
    else if(fa.q13==='偶爾懷疑有') p.push('偶爾出現疑似過敏的反應');
  }
  return p.length ? p.join('；') : '根據整體年齡、體型與問卷回答的綜合評估';
}

async function sendEmails(scores, ownerEmail){
  if(!CFG.ejsKey||!CFG.ejsSvc||!CFG.ejsTpl) return;
  const ip = await fetchIP();
  const sends=[];

  // 管理員：開關控制
  if(CFG.adminEmailEnabled!==false){
    sends.push(emailjs.send(CFG.ejsSvc, CFG.ejsTpl, {
      to_email: CFG.adminEmail,
      subject: `【新問卷】${S.basic.species==='貓'?'🐱':'🐶'} ${S.basic.name} 的保健分析`,
      html_body: buildAdminNotifHTML(ownerEmail||'', ip),
    }));
  }

  // 飼主：只有填信箱才收到完整分析報告
  if(ownerEmail){
    sends.push(emailjs.send(CFG.ejsSvc, CFG.ejsTpl, {

      subject: `🐾 ${S.basic.name} 的專屬保健分析報告`,
      html_body: buildEmailHTML(scores),
    }));
  }

  await Promise.allSettled(sends);
}

function decodeJwt(t){
  try{
    const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    // 正確解碼 UTF-8（修正中文亂碼）
    const json=decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(_){return {};}
}

function checkLineReturn(){
  const p=new URLSearchParams(window.location.search);
  if(!p.has('code')||!p.has('state')) return false;
  if(localStorage.getItem('ps_lineState')!==p.get('state')) return false;
  try{
    const st=JSON.parse(localStorage.getItem('ps_state')||'{}');
    if(!st.screen) return false;
    Object.assign(S,st);
    localStorage.removeItem('ps_state'); localStorage.removeItem('ps_lineState');
    window.history.replaceState({},'',window.location.pathname);
    S.lineCallbackPending=true; return true;
  }catch(_){return false;}
}

async function handleLogin(user){
  S.user=user; S.lineCallbackPending=false;
  if(user.email&&!S.ownerEmail) S.ownerEmail=user.email;
  // 若在信箱頁面登入，先算分數並跳到結果頁
  if(S.screen==='email'){
    $('survey').innerHTML='<div class="loading">⏳ 正在分析毛孩的健康狀況…</div>';
    const scores=computeScores(); S.scores=scores;
    await saveSubmission(scores);
    // 寫入試算表（提交記錄）
    const hb=S.basic;
    const hAge={puppy:'未滿1歲',adult:'1–6歲',mature7:'7–9歲',senior10:'10歲以上'}[hb.age]||hb.age;
    const hSize={small:'小型',medium:'中型',large:'大型/巨型'}[hb.size]||hb.size;
    const hIp=await fetchIP();
    sendToSheet({
      type:'submission',
      time:new Date().toLocaleString('zh-TW'),
      ip:hIp,
      petName:hb.name, species:hb.species, breed:hb.breed||'',
      age:hAge, size:hSize,
      scores:JSON.stringify({joint:hScore(scores.joint),coat:hScore(scores.coat),cardio:hScore(scores.cardio),gi:hScore(scores.gi),immune:hScore(scores.immune)}),
      topRec:['joint','coat','cardio','gi','immune']
        .map(k=>[k,scores[k]]).sort((a,c)=>c[1]-a[1])
        .slice(0,3).map(([k])=>({joint:'關節',coat:'毛髮',cardio:'心血管',gi:'腸胃',immune:'免疫'}[k])).join('、'),
    }, CFG.sheetUrl2);
    S.screen='results';
  }
  try{
    let arr=[];
    try{const r=await window.storage.get(SK.emails,true);if(r)arr=JSON.parse(r.value);}catch(_){}
    if(user.email&&!arr.find(e=>e.email===user.email)){
      arr.push({email:user.email,name:user.name,provider:user.provider,ts:Date.now()});
      await window.storage.set(SK.emails,JSON.stringify(arr),true);
    }
  }catch(_){}
  const loginIp = await fetchIP();
  sendToSheet({
    type:'login', time:new Date().toLocaleString('zh-TW'),
    ip: loginIp,
    provider:user.provider, name:user.name||'', email:user.email||'',
    photo:user.photo||'', extra:JSON.stringify(user.extra||{}), petName:S.basic.name,
  }, CFG.sheetUrl2);
  if(user.email){ S.emailProvided=true; try{await sendEmails(S.scores,user.email);}catch(_){} }
  render();
}

function loginGoogle(){
  if(!CFG.googleClientId){alert('請設定 CFG.googleClientId');return;}
  if(typeof google==='undefined'||!google.accounts){alert('Google SDK 未載入，請稍後再試');return;}
  // 建立選帳號 modal
  document.getElementById('g_modal')?.remove();
  const m=document.createElement('div');
  m.id='g_modal';
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center';
  m.innerHTML='<div style="background:#fff;padding:28px;border-radius:16px;text-align:center;width:300px;box-shadow:0 8px 32px rgba(0,0,0,.3)">'
    +'<p style="font-size:14px;color:#333;margin-bottom:16px">選擇 Google 帳號繼續</p>'
    +'<div id="g_btn_wrap"></div>'
    +'<br><button onclick="document.getElementById(&quot;g_modal&quot;).remove()" style="font-size:12px;color:#888;background:none;border:none;cursor:pointer;margin-top:10px">取消</button>'
    +'</div>';
  document.body.appendChild(m);
  google.accounts.id.initialize({
    client_id:CFG.googleClientId,
    callback:(res)=>{
      document.getElementById('g_modal')?.remove();
      const p=decodeJwt(res.credential);
      handleLogin({provider:'google',name:p.name||'',email:p.email||'',photo:p.picture||'',
        extra:{googleId:p.sub,givenName:p.given_name,familyName:p.family_name}});
    },
  });
  google.accounts.id.renderButton(document.getElementById('g_btn_wrap'),
    {theme:'outline',size:'large',text:'signin_with',width:250});
}

function loginFacebook(){
  if(!CFG.facebookAppId){alert('請設定 CFG.facebookAppId');return;}

  // 直接開 OAuth popup，不透過 SDK 快取，每次都顯示完整登入表單（支援切換帳號）
  const redirectUri = encodeURIComponent(window.location.href.split('?')[0].split('#')[0]);
  const scope = 'public_profile,email';
  const popupUrl = 'https://www.facebook.com/dialog/oauth'
    + '?client_id=' + CFG.facebookAppId
    + '&redirect_uri=' + redirectUri
    + '&scope=' + scope
    + '&response_type=token'
    + '&display=popup';

  const popup = window.open(popupUrl, 'fb_login', 'width=600,height=700,scrollbars=yes');
  if(!popup){ alert('請允許彈出視窗後再試一次'); return; }

  const timer = setInterval(()=>{
    try{
      if(popup.closed){ clearInterval(timer); return; }
      const hash = popup.location.hash || '';
      if(hash.includes('access_token')){
        clearInterval(timer);
        const token = hash.match(/access_token=([^&]+)/)?.[1];
        popup.close();
        if(token) fetchFBProfile(token);
      } else if(hash.includes('error') || popup.location.href.includes('error_reason')){
        clearInterval(timer);
        popup.close();
      }
    }catch(_){ /* cross-origin，繼續等 */ }
  }, 300);
}

async function fetchFBProfile(token){
  try{
    const r = await fetch('https://graph.facebook.com/me?fields=name,email,picture.width(200),birthday,gender,hometown,location&access_token='+token);
    const data = await r.json();
    if(data.error){ console.warn('FB API error', data.error); return; }
    handleLogin({
      provider:'facebook', name:data.name||'', email:data.email||'',
      photo:data.picture?.data?.url||'',
      extra:{
        facebookId: data.id||'',
        birthday:   data.birthday||'',
        gender:     data.gender||'',
        hometown:   data.hometown?.name||'',
        location:   data.location?.name||'',
      }
    });
  }catch(e){ console.warn('fetchFBProfile error',e); }
}

    </div>

    <div class="nav"><div></div>
      <button class="btn btn-pri" onclick="submitBasic()">下一步 →</button>
    </div>`;
}


function pickAge(v){
  S.basic.age=v;
  document.querySelectorAll('[data-age]').forEach(el=>el.classList.toggle('sel',el.dataset.age===v));
}
function pickSize(v){
  S.basic.size=v;
  document.querySelectorAll('[data-size]').forEach(el=>el.classList.toggle('sel',el.dataset.size===v));
}

async function submitBasic(){
  const name=$('fn').value.trim();
  if(!name){alert('請填寫寵物名稱');return;}
  if(!S.basic.age){alert('請選擇年齡階段');return;}
  if(!S.basic.size){alert('請選擇體型');return;}
  S.basic.name=name; S.basic.species=$('fs').value;
  S.basic.breed=$('fb').value.trim();
  S.fq=[...FQS]; S.fidx=0;
  S.screen='followup';
  render();
}



function renderFollowup(){
  const total=S.fq.length, cur=S.fq[S.fidx];
  const progActive=Math.max(1,Math.min(3,1+Math.round(S.fidx/(Math.max(total-1,1))*2)));
  $('survey').innerHTML=`
    ${prog(progActive)}
    <div class="step-cnt">${S.fidx+1} / ${total}</div>
    <div class="bq">${cur.q}</div>
    ${cur.sub?`<div class="bq-sub">（${cur.sub}）</div>`:''}
    <div class="opt-row" style="margin-top:${cur.sub?'10px':'16px'}">
      ${cur.opts.map((o,i)=>`<div class="opt ${S.fans[cur.id]===o?'sel':''}" data-oi="${i}" onclick="answerFQ('${cur.id}',${i})">${o}</div>`).join('')}
    </div>
    <div class="nav">
      <button class="btn btn-ghost" onclick="fqPrev()">← 上一步</button>
      <button class="btn btn-pri" id="fqnext" ${S.fans[cur.id]?'':'disabled'} onclick="fqNext()">下一步 →</button>
    </div>`;
}

function answerFQ(qid,optIdx){
  S.fans[qid]=S.fq[S.fidx].opts[optIdx];
  document.querySelectorAll('[data-oi]').forEach(el=>el.classList.toggle('sel',parseInt(el.dataset.oi)===optIdx));
  $('fqnext').disabled=false;
}
function fqNext(){if(S.fidx<S.fq.length-1){S.fidx++;render();}else{S.screen='email';render();}}
function fqPrev(){if(S.fidx>0){S.fidx--;render();}else{S.screen='basic';render();}}

function renderEmail(){
  $('survey').innerHTML=`
    ${prog(3)}
    <div class="card" style="box-shadow:none;padding:10px 0">
      ${buildLoginHTML(true)}
    </div>`;
}

async function submitEmail(skip){
  if(!skip){const v=$('femail');if(v)S.ownerEmail=v.value.trim();}
  else S.ownerEmail='';
  S.emailProvided = !skip && !!S.ownerEmail;
  $('survey').innerHTML=`<div class="loading">⏳ 正在分析毛孩的健康狀況…</div>`;
  const scores=computeScores(); S.scores=scores;
  await saveSubmission(scores);
  // 寫入試算表（提交記錄）
  const b=S.basic;
  const ageLabel={puppy:'未滿1歲',adult:'1–6歲',mature7:'7–9歲',senior10:'10歲以上'}[b.age]||b.age;
  const sizeLabel={small:'小型',medium:'中型',large:'大型/巨型'}[b.size]||b.size;
  const subIp = await fetchIP();
  sendToSheet({
    type:'submission',
    time: new Date().toLocaleString('zh-TW'),
    ip: subIp,
    petName: b.name,
    species: b.species,
    breed: b.breed||'',
    age: ageLabel,
    size: sizeLabel,
    scores: JSON.stringify({joint:hScore(scores.joint),coat:hScore(scores.coat),cardio:hScore(scores.cardio),gi:hScore(scores.gi),immune:hScore(scores.immune)}),
    topRec: ['joint','coat','cardio','gi','immune']
      .map(k=>[k,scores[k]]).sort((a,c)=>c[1]-a[1])
      .slice(0,3).map(([k])=>({joint:'關節',coat:'毛髮',cardio:'心血管',gi:'腸胃',immune:'免疫'}[k])).join('、'),
  }, CFG.sheetUrl2);
  try{await sendEmails(scores, S.ownerEmail);}catch(e){console.warn('email err',e);}
  S.screen='results'; render();
}

async function unlockFull(){
  const v=$('unlock_email');
  if(!v||!v.value.trim()){alert('請輸入信箱');return;}
  S.ownerEmail=v.value.trim(); S.emailProvided=true;
  try{
    let arr=[];
    try{const r=await window.storage.get(SK.emails,true);if(r)arr=JSON.parse(r.value);}catch(_){}
    arr.push({email:S.ownerEmail,name:S.basic.name,ts:Date.now()});
    await window.storage.set(SK.emails,JSON.stringify(arr),true);
  }catch(_){}
  try{await sendEmails(S.scores,S.ownerEmail);}catch(e){console.warn('email err',e);}
  render();
}

function renderRadar(scores){
  const order=['joint','coat','cardio','gi','immune'];
  const labels=['關節骨骼','毛髮皮膚','心血管','腸胃消化','免疫調節'];
  const cx=150,cy=155,R=95,n=order.length;
  const angle=i=>(Math.PI*2*i/n)-Math.PI/2;
  const pt=(i,r)=>[cx+r*Math.cos(angle(i)),cy+r*Math.sin(angle(i))];

  const rings=[.25,.5,.75,1].map(f=>{
    const pts=order.map((_,i)=>pt(i,R*f).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#ddd8ce" stroke-width="1"/>`;
  }).join('');

  const axes=order.map((_,i)=>{
    const[x,y]=pt(i,R);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#ddd8ce" stroke-width="1"/>`;
  }).join('');

  const dataPts=order.map((k,i)=>pt(i,R*Math.max(hScore(scores[k]||0)/100,0.02)));
  const dataStr=dataPts.map(p=>p.join(',')).join(' ');

  const labelEls=labels.map((lb,i)=>{
    const[x,y]=pt(i,R+24);
    return `<text x="${x}" y="${y}" font-size="11.5" fill="#5a5f52" text-anchor="middle" dominant-baseline="middle" font-family="Noto Sans TC,sans-serif">${lb}</text>`;
  }).join('');

  const dots=dataPts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#c97f1f"/>`).join('');

  return `<svg viewBox="0 0 300 310" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:260px;display:block;margin:0 auto">
    ${rings}${axes}
    <polygon points="${dataStr}" fill="rgba(201,127,31,0.18)" stroke="#c97f1f" stroke-width="2.2" stroke-linejoin="round"/>
    ${dots}${labelEls}
  </svg>`;
}

function renderResults(){
  const sc=S.scores, b=S.basic;
  const emoji=b.species==='貓'?'🐱':b.species==='狗'?'🐶':'🐾';
  const CAT_ORDER=['joint','coat','cardio','gi','immune'];
  const full=S.emailProvided||!!S.user;
  const recs=CAT_ORDER.map(k=>[k,sc[k]]).sort((a,c)=>c[1]-a[1]).slice(0,3);
  const scoreBars=CAT_ORDER.map(k=>{
    const v=sc[k], h=hScore(v), si=scoreInfo(h);
    return `<div class="srow">
      <div class="srow-top">
        <span><span class="sdot" style="background:${si.dot}"></span>${CATS[k].icon} ${CATS[k].label}
          <span style="font-size:12px;font-weight:400;color:var(--ink2);margin-left:4px">健康指數 ${h}</span></span>
      </div>
      <div class="sbar-bg"><div class="sbar" style="width:${h}%;background:${CATS[k].color}"></div></div>
      <div class="stext">${si.text}</div>
    </div>`;
  }).join('');

  const recCards=recs.map(([k,v],i)=>{
    const c=CATS[k];
    return `<div class="rc">
      <div class="rc-rank">推薦 ${i+1}</div>
      <div class="rc-name">${c.icon} ${c.label} <span style="font-size:13px;font-weight:400;color:var(--ink2);margin-left:4px">健康指數 ${hScore(v)}</span></div>
      <div class="rc-bar-bg"><div class="rc-bar" style="width:${hScore(v)}%;background:${c.color}"></div></div>
      <div class="rc-tags">${c.ings.map(([n])=>`<span class="rc-tag">${n}</span>`).join('')}</div>
      <div class="rc-why">重點功效：${c.ings.slice(0,2).map(([,b])=>b).join('；')}</div>
    </div>`;
  }).join('');

  const providerIcons={google:'G',facebook:'f',line:'L',email:'✉'};
  const userBadge = S.user ? '<div style="display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px">'
    +(S.user.photo?'<img src="'+S.user.photo+'" style="width:30px;height:30px;border-radius:50%;object-fit:cover">'
    :'<span style="font-size:20px">👤</span>')
    +'<div><strong>'+S.user.name+'</strong>'
    +'<div style="font-size:11px;color:var(--ink2)">'
    +{google:'Google',facebook:'Facebook',line:'LINE',email:'信箱'}[S.user.provider]
    +' 已登入</div></div></div>' : '';

  const lockedSection = full ? userBadge+`
    <div class="recs-h">🌿 保健食品建議</div>
    <div class="rec-cards">${recCards}</div>
    <div class="disc">⚠️ 以上建議由問卷回答自動生成，僅供保健方向參考，並非醫療診斷。毛孩如有明顯不適或慢性病史，請務必諮詢獸醫師後再選用保健食品。</div>
  ` : `
    <div style="background:#fdf6e8;border:1.5px dashed #c97f1f;border-radius:16px;padding:24px 20px;margin-top:8px">
      ${buildLoginHTML(false)}
  `;

  $('survey').innerHTML=`
    <div class="badge">✦ 專屬照顧方案</div>
    <div class="res-title">這是專屬於 <em>${b.name}</em> 的照顧方案</div>
    <div class="res-desc">我們根據你的填答，依 ${b.name} 的年齡、體型與觀察狀況做調整，<br>為牠推薦最貼近需求的建議配方。</div>
    <div class="pet-chip">
      <div class="ava">${emoji}</div>
      <span>${b.name}</span>
      <span class="pet-sep">|</span><span>${{puppy:'未滿1歲',adult:'1–6歲',mature7:'7–9歲',senior10:'10歲以上'}[b.age]||b.age}</span>
      <span class="pet-sep">|</span><span>${{small:'小型',medium:'中型',large:'大型/巨型'}[b.size]||b.size}</span>
      <span class="pet-sep">|</span><span>${b.species}</span>
    </div>
    <div class="res-cols">
      <div class="res-l" style="display:flex;align-items:center;justify-content:center;padding:12px 8px">
        ${renderRadar(sc)}
      </div>
      <div class="res-r">
        <h3>照護狀態一覽</h3>
        <div class="cat-info">ⓘ 燈號顯示的是目前的照護狀態，讓你快速了解牠的需要。</div>
        ${scoreBars}
      </div>
    </div>
    ${S.coatNote ? `<div style="background:#fdf6e8;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13px;color:#7a4d0d;margin-bottom:12px;line-height:1.6">💡 ${S.coatNote}</div>` : ''}
    ${lockedSection}
    <div class="restart-row" style="margin-top:16px"><button class="btn btn-ghost" onclick="restart()">重新填寫一份</button></div>`;
}


/* ══════════ INIT ══════════ */
function render(){
  const screens={basic:renderBasic,
    followup:renderFollowup,email:renderEmail,results:renderResults};
  (screens[S.screen]||renderBasic)();
}

function restart(){
  S={screen:'basic',basic:{name:'',species:'狗',breed:'',age:'',size:''},
    symptoms:[],fq:[],fidx:0,fans:{},ownerEmail:'',scores:{},emailProvided:false,user:null,lineCallbackPending:false,tracked:false};
  render();
}


// 全域初始化 EmailJS（只需呼叫一次）
window.addEventListener('load', ()=>{
  // EmailJS
  if(CFG.ejsKey && typeof emailjs !== 'undefined'){
    emailjs.init(CFG.ejsKey);
  }
});

checkLineReturn();
render();
</script>
